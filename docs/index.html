* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #3f7f68;
  --bg-deep: #35705c;
  --panel: rgba(255, 255, 255, 0.10);
  --plate: #2b6451;
  --tile: #f7f3dd;
  --tile-edge: #ded8bb;
  --ink: #2c4a3d;
  --fill: #b3e874;
  --white: #f3f7f4;
  --danger: #ffb4a2;
  --cell: clamp(42px, 13vmin, 68px);
  --gap: clamp(4px, 1.2vmin, 8px);
  font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
}

html, body { margin: 0; height: 100%; }

/* dvh \u2014 \u0432\u044B\u0441\u043E\u0442\u0430 \u0432\u0438\u0434\u0438\u043C\u043E\u0439 \u0447\u0430\u0441\u0442\u0438 \u044D\u043A\u0440\u0430\u043D\u0430: \u043F\u0430\u043D\u0435\u043B\u044C \u043C\u043E\u0431\u0438\u043B\u044C\u043D\u043E\u0433\u043E \u0431\u0440\u0430\u0443\u0437\u0435\u0440\u0430 \u0435\u0451 \u0431\u043E\u043B\u044C\u0448\u0435 \u043D\u0435 \u0441\u044A\u0435\u0434\u0430\u0435\u0442. */
@supports (height: 100dvh) {
  html, body { height: 100dvh; }
}

body {
  background: var(--bg);
  color: var(--white);
  display: flex;
  justify-content: center;
  overscroll-behavior: none;
}

#root { width: 100%; max-width: 560px; display: flex; flex-direction: column; min-height: 100%; }

button {
  font: inherit;
  color: var(--ink);
  background: var(--tile);
  border: none;
  border-radius: 12px;
  padding: 10px 18px;
  cursor: pointer;
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.18);
  transition: transform 0.08s ease;
}
button:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.18); }
button.ghost { background: var(--panel); color: var(--white); box-shadow: none; }
button:disabled { opacity: 0.45; cursor: default; }

/* \u2500\u2500 \u0448\u0430\u043F\u043A\u0430: \u043F\u0440\u043E\u0433\u0440\u0435\u0441\u0441 \u0438 \u043D\u0430\u0439\u0434\u0435\u043D\u043D\u044B\u0435 \u0441\u043B\u043E\u0432\u0430 \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */

.hud { padding: 14px 16px 0; }

.progress-row { display: flex; align-items: center; gap: 10px; }
.back { padding: 6px 12px; font-size: 15px; line-height: 1; }
.icon { padding: 6px 10px; font-size: 15px; line-height: 1; }

.track {
  position: relative;
  flex: 1;
  height: 14px;
  background: var(--bg-deep);
  border-radius: 999px;
  overflow: hidden;
}
.track > i {
  position: absolute;
  inset: 0 auto 0 0;
  background: var(--fill);
  border-radius: 999px;
  transition: width 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.progress-label {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--white);
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
}
.deck { position: relative; width: 26px; height: 32px; flex: none; }
.deck i {
  position: absolute;
  inset: 0;
  background: var(--tile);
  border-radius: 5px;
  border-bottom: 2px solid var(--tile-edge);
}
.deck i:first-child { transform: rotate(-9deg) translateX(-3px); opacity: 0.75; }
.deck b {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: var(--ink);
  font-size: 13px;
}

.words {
  margin-top: 12px;
  min-height: 84px;
  background: var(--panel);
  border-radius: 14px;
  padding: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-content: flex-start;
}
.word { display: flex; gap: 2px; animation: fly-in 0.35s ease-out both; }
.word span {
  width: 20px;
  height: 22px;
  display: grid;
  place-items: center;
  background: var(--tile);
  color: var(--ink);
  border-radius: 4px;
  font-size: 13px;
  font-weight: 700;
}
@keyframes fly-in {
  from { transform: translateY(26px) scale(0.8); opacity: 0; }
  to { transform: none; opacity: 1; }
}

/* \u2500\u2500 \u043F\u043E\u043B\u0435 \u0441 \u0444\u0438\u0433\u0443\u0440\u043E\u0439 \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */

.stage { flex: 1; display: grid; place-items: center; padding: 18px 16px; overflow: hidden; }

.draft { height: 40px; display: flex; gap: 3px; align-items: center; justify-content: center; }
.draft span {
  width: 26px;
  height: 30px;
  display: grid;
  place-items: center;
  background: var(--white);
  color: var(--ink);
  border-radius: 6px;
  font-weight: 700;
  animation: pop 0.12s ease-out;
}
.draft.known span { background: var(--fill); }
@keyframes pop { from { transform: scale(0.6); } to { transform: none; } }

.board {
  position: relative;
  touch-action: none;
  user-select: none;
  animation: slide-in 0.42s cubic-bezier(0.18, 0.72, 0.3, 1) both;
}
@keyframes slide-in {
  from { transform: translateX(-130%) rotate(-6deg); opacity: 0; }
  to { transform: none; opacity: 1; }
}

.board .plate {
  position: absolute;
  inset: 0;
  pointer-events: none;
  filter: drop-shadow(0 6px 0 rgba(0, 0, 0, 0.18));
}
.board .plate path {
  fill: var(--plate);
  stroke: var(--plate);
  stroke-width: 14;
  stroke-linejoin: round;
  paint-order: stroke;
}
.board.crumbling .plate { animation: plate-out 0.34s ease-in forwards; }
@keyframes plate-out {
  to { transform: scale(0.94); opacity: 0; }
}
.board svg { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.board svg polyline { fill: none; stroke: rgba(255, 255, 255, 0.4); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }

.tile {
  position: absolute;
  width: var(--cell);
  height: var(--cell);
  background: var(--tile);
  color: var(--ink);
  border-bottom: 3px solid var(--tile-edge);
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-size: calc(var(--cell) * 0.46);
  font-weight: 700;
  transition: transform 0.12s ease, background 0.12s ease;
}
.tile.picked { background: var(--fill); transform: scale(1.06); }
.tile.hinted { box-shadow: 0 0 0 3px var(--fill); }

.tile.crumble {
  animation: crumble 0.62s forwards;
}
@keyframes crumble {
  0% {
    transform: none;
    opacity: 1;
    animation-timing-function: cubic-bezier(0.2, 0.8, 0.3, 1);
  }
  20% {
    transform: translateY(-12px) scale(1.05) rotate(calc(var(--rot) / 6));
    opacity: 1;
    animation-timing-function: cubic-bezier(0.45, 0, 0.9, 1);
  }
  85% {
    opacity: 0.25;
  }
  100% {
    transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(0.62);
    opacity: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .board { animation-duration: 0.01s; }
  .tile.crumble { animation-duration: 0.2s; }
}

.footer {
  padding: 0 16px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-size: 13px;
  font-weight: 700;
  opacity: 0.95;
}

/* \u2500\u2500 \u043A\u0430\u0440\u0442\u0430 \u0443\u0440\u043E\u0432\u043D\u0435\u0439 \u0438 \u0438\u0442\u043E\u0433\u0438 \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */

.screen { padding: 24px 18px; display: flex; flex-direction: column; gap: 18px; }
.screen h1 { margin: 0; font-size: 30px; letter-spacing: 0.5px; }
.screen p { margin: 0; line-height: 1.5; opacity: 0.92; }

.levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 10px; }
.level-card {
  background: var(--panel);
  border-radius: 14px;
  padding: 10px 6px;
  text-align: center;
  display: grid;
  gap: 2px;
  color: var(--white);
  box-shadow: none;
}
.level-card b { font-size: 18px; }
.level-card small { font-size: 11px; opacity: 0.8; }
.level-card.done { background: rgba(179, 232, 116, 0.22); }
.level-card.locked { opacity: 0.35; }

.overlay {
  position: fixed;
  inset: 0;
  z-index: 10;
  background: rgba(20, 45, 36, 0.72);
  display: grid;
  place-items: center;
  padding: 18px;
  animation: fade 0.2s ease-out;
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.card {
  width: 100%;
  max-width: 420px;
  background: var(--bg);
  border-radius: 18px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  max-height: 86vh;
  overflow: auto;
}
.card h2 { margin: 0; font-size: 24px; }
.recap { display: grid; gap: 8px; font-size: 14px; }
.recap div { display: flex; justify-content: space-between; gap: 10px; }
.recap .taken { font-weight: 700; }
.recap .missed { opacity: 0.75; text-align: right; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }

/* \u2500\u2500 \u043F\u0430\u043D\u0435\u043B\u044C \u043E\u0442\u043B\u0430\u0434\u043A\u0438 \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */

.debug-toggle { padding: 6px 10px; font-size: 11px; opacity: 0.6; }
.debug {
  position: fixed;
  left: 10px;
  bottom: 56px;
  z-index: 30;
  width: min(320px, calc(100vw - 20px));
  background: rgba(12, 32, 26, 0.95);
  border-radius: 12px;
  padding: 12px;
  font-size: 12px;
  line-height: 1.5;
  display: grid;
  gap: 8px;
  max-height: 60vh;
  overflow: auto;
}
.debug code { color: var(--fill); }
